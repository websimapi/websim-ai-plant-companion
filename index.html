<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Plant Companion</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌱 AI Plant Companion</h1>
            <p>Your plant listens and grows based on your voice and emotions</p>
        </header>
        
        <div class="plant-container">
            <canvas id="plantCanvas" width="400" height="500"></canvas>
            <div class="plant-status">
                <div class="status-item">
                    <span class="label">Mood:</span>
                    <span id="plantMood">Neutral</span>
                </div>
                <div class="status-item">
                    <span class="label">Growth Stage:</span>
                    <span id="plantGrowth">Seedling</span>
                </div>
                <div class="status-item">
                    <span class="label">Last Response:</span>
                    <span id="lastResponse">Waiting for your voice...</span>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button id="startListening" class="btn primary">🎤 Start Listening</button>
            <button id="stopListening" class="btn secondary" disabled>🔇 Stop Listening</button>
            <div class="audio-visualizer">
                <canvas id="visualizer" width="300" height="60"></canvas>
            </div>
        </div>
        
        <div class="data-display">
            <h3>Current Audio Analysis</h3>
            <div class="data-grid">
                <div class="data-item">
                    <label>Speech:</label>
                    <span id="speechText">-</span>
                </div>
                <div class="data-item">
                    <label>Dominant Frequency:</label>
                    <span id="dominantFreq">-</span>
                </div>
                <div class="data-item">
                    <label>Volume Level:</label>
                    <span id="volumeLevel">-</span>
                </div>
                <div class="data-item">
                    <label>Tone:</label>
                    <span id="toneAnalysis">-</span>
                </div>
            </div>
        </div>
        
        <div class="plant-thoughts">
            <h3>🌿 Plant's Thoughts</h3>
            <div id="plantThoughts">I'm waiting to hear your voice...</div>
        </div>
    </div>

    <script src="main.js"></script>
    <script src="plant.js"></script>

</body>
</html>
